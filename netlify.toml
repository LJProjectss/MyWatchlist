[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Alle overige routes naar de React-app sturen (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# De service worker nooit cachen, anders komen updates niet door
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
